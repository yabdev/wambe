apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: wambe-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/network-interfaces: '[{"network":"VPC_NETWORK","subnetwork":"VPC_SUBNETWORK"}]'
        run.googleapis.com/vpc-access-egress: all-traffic
    spec:
      serviceAccountName: API_SERVICE_ACCOUNT
      containerConcurrency: 40
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/wambe/wambe-api@sha256:API_IMAGE_DIGEST
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: staging
            - name: STORAGE_TYPE
              value: supabase
            - name: INTERNAL_JOB_KEY
              value: ""
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wambe-database-url
                  key: latest
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: wambe-database-user
                  key: latest
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wambe-database-password
                  key: latest
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: wambe-flyway-user
                  key: latest
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wambe-flyway-password
                  key: latest
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: wambe-supabase-service-role
                  key: latest
            - name: SCANNER_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: wambe-scanner-hmac
                  key: latest
            - name: SUPABASE_URL
              value: SUPABASE_URL
            - name: SUPABASE_JWKS_URI
              value: SUPABASE_JWKS_URI
            - name: SUPABASE_ISSUER
              value: SUPABASE_ISSUER
            - name: CORS_ALLOWED_ORIGINS
              value: FRONTEND_ORIGIN
            - name: PUBLIC_BASE_URL
              value: FRONTEND_ORIGIN
            - name: API_BASE_URL
              value: API_ORIGIN
            - name: SCANNER_URL
              value: PRIVATE_SCANNER_ORIGIN
            - name: SCANNER_AUDIENCE
              value: PRIVATE_SCANNER_ORIGIN
            - name: SCHEDULER_SUBJECT
              value: SCHEDULER_SERVICE_ACCOUNT
            - name: SCHEDULER_AUDIENCE
              value: API_ORIGIN
