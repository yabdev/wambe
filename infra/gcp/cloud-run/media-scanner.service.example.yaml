apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: media-scanner
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: SCANNER_SERVICE_ACCOUNT
      containerConcurrency: 1
      timeoutSeconds: 120
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/wambe/media-scanner@sha256:SCANNER_IMAGE_DIGEST
          ports:
            - name: http1
              containerPort: 8081
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: SCANNER_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: wambe-scanner-hmac
                  key: latest
