spring:
  application:
    name: wambe-api
  http:
    converters:
      preferred-json-mapper: jackson2
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wambe}
    username: ${DATABASE_USER:wambe_api}
    password: ${DATABASE_PASSWORD:wambe_local}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:1}
      connection-timeout: 10000
  flyway:
    enabled: true
    user: ${FLYWAY_USER:${DATABASE_USER:wambe_api}}
    password: ${FLYWAY_PASSWORD:${DATABASE_PASSWORD:wambe_local}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson2:
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URI:http://localhost:9999/.well-known/jwks.json}

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

wambe:
  security:
    request-envelope:
      max-bytes: 16384
  auth:
    issuer: ${SUPABASE_ISSUER:https://example.supabase.co/auth/v1}
    audience: authenticated
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  api-base-url: ${API_BASE_URL:http://localhost:8080}
  scanner:
    hmac-secret: ${SCANNER_HMAC_SECRET:}
    callback-tolerance: PT5M
    url: ${SCANNER_URL:http://localhost:8081}
    audience: ${SCANNER_AUDIENCE:}
  internal-jobs:
    local-key: ${INTERNAL_JOB_KEY:}
    scheduler-subject: ${SCHEDULER_SUBJECT:}
    issuer: ${SCHEDULER_ISSUER:https://accounts.google.com}
    jwks-uri: ${SCHEDULER_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
    audience: ${SCHEDULER_AUDIENCE:https://api.wambe.africa}
  storage:
    type: ${STORAGE_TYPE:local}
    local-root: ${LOCAL_STORAGE_ROOT:./.local-storage}
    quarantine-bucket: ${STORAGE_QUARANTINE_BUCKET:media-quarantine}
    active-bucket: ${STORAGE_ACTIVE_BUCKET:media-active}
  supabase:
    url: ${SUPABASE_URL:https://example.supabase.co}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:local-unconfigured}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
