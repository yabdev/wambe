spring:
  application:
    name: media-scanner

server:
  port: ${PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

wambe:
  scanner:
    hmac-secret: ${SCANNER_HMAC_SECRET:local-scanner-secret-change-me}
    request-tolerance: PT5M
    max-bytes: 10485760
    clamd-host: ${CLAMD_HOST:127.0.0.1}
    clamd-port: ${CLAMD_PORT:3310}
