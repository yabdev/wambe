spring:
  application:
    name: media-scanner

server:
  port: ${PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

wambe:
  security:
    request-envelope:
      max-bytes: 16384
  scanner:
    hmac-secret: ${SCANNER_HMAC_SECRET:}
    request-tolerance: PT5M
    max-bytes: 10485760
    clamd-host: ${CLAMD_HOST:127.0.0.1}
    clamd-port: ${CLAMD_PORT:3310}
    destinations:
      supabase-url: ${SUPABASE_URL:}
      api-base-url: ${API_BASE_URL:}
      allow-local: false
