name: Release images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment authorizing artifact publication
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_ARTIFACT_PUBLISHER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/wambe-api/Dockerfile
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wambe/wambe-api:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Build and publish scanner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/media-scanner/Dockerfile
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wambe/media-scanner:${{ github.sha }}
          provenance: mode=max
          sbom: true
